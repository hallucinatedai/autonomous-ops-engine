[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ops-engine"
version = "0.1.0"
description = "AI-native workflow orchestration system for enterprise operations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Akash Raj" },
    { name = "Prem Kumar" },
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ops_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
